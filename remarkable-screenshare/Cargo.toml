[package]
name = "remarkable-screenshare"
version = "0.1.0"
edition = "2021"
description = "Screen share viewer for reMarkable tablets - WebRTC and USB framebuffer capture"
license = "MIT"
readme = "README.md"
keywords = ["remarkable", "screenshare", "webrtc", "vnc", "rfb"]

[lib]
name = "remarkable_screenshare"
path = "src/lib.rs"

[[bin]]
name = "remarkable-screenshare"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# WebRTC - using webrtc-rs (native Rust WebRTC stack)
webrtc = "0.11"

# MQTT client
rumqttc = { version = "0.24", features = ["websocket"] }

# SSH for USB capture
russh = "0.62"
russh-keys = "0.46"

# Image processing
image = { version = "0.25", features = ["png", "jpeg", "gif", "bmp"] }

# Video recording
# Using gstreamer for WebM/MP4 encoding
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }

# Web server for browser viewer
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# JWT decoding (for token parsing)
jsonwebtoken = "10"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
recording = ["gstreamer", "gstreamer-app", "gstreamer-video"]

[profile.release]
lto = true
codegen-units = 1
strip = true
