<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reMarkable Screen Share Viewer</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --primary: #4a9eff;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --text: #f5f5f5;
            --text-muted: #888;
            --border: #333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
        }
        
        h1 {
            font-size: 18px;
            font-weight: 500;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            background: var(--surface-hover);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        
        .status-dot.connected { background: var(--success); }
        .status-dot.connecting { background: var(--warning); animation: pulse 1s infinite; }
        .status-dot.streaming { background: var(--primary); animation: pulse 0.5s infinite; }
        .status-dot.error { background: var(--error); }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        .viewer {
            background: #fff;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 100%;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: #f5f5f5;
            border-radius: 4px;
        }
        
        .controls {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .control-group {
            display: flex;
            gap: 8px;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.98); }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        
        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text);
        }
        
        .stats {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .config {
            padding: 24px;
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 24px;
        }
        
        .config h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }
        
        .config-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        input, select {
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }
        
        .field {
            display: flex;
            flex-direction: column;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .overlay.hidden { display: none; }
        
        .modal {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        
        .modal h3 {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            <h1>reMarkable Screen Share</h1>
        </div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </header>
    
    <main>
        <div class="viewer">
            <canvas id="screen" width="1872" height="1404"></canvas>
        </div>
    </main>
    
    <div class="controls">
        <div class="control-group">
            <button class="btn-primary" onclick="connect()" id="btnConnect">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Connect
            </button>
            <button class="btn-secondary" onclick="disconnect()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"/>
                    <rect x="14" y="4" width="4" height="16"/>
                </svg>
                Disconnect
            </button>
            <button class="btn-secondary" onclick="saveFrame()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Save
            </button>
            <button class="btn-secondary" onclick="toggleFullscreen()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 3 21 3 21 9"/>
                    <polyline points="9 21 3 21 3 15"/>
                    <line x1="21" y1="3" x2="14" y2="10"/>
                    <line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
                Fullscreen
            </button>
        </div>
        
        <div class="stats">
            <div class="stat">
                <span>FPS:</span>
                <strong id="fps">0</strong>
            </div>
            <div class="stat">
                <span>Frames:</span>
                <strong id="frames">0</strong>
            </div>
            <div class="stat">
                <span>Latency:</span>
                <strong id="latency">-</strong>
            </div>
        </div>
    </div>
    
    <div class="overlay hidden" id="configOverlay">
        <div class="modal">
            <h3>Connection Settings</h3>
            <div class="config">
                <div class="field">
                    <label>Server URL</label>
                    <input type="text" id="serverUrl" placeholder="ws://localhost:8088/ws" />
                </div>
            </div>
            <div class="control-group">
                <button class="btn-primary" onclick="saveConfig()">Save</button>
                <button class="btn-secondary" onclick="closeConfig()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fpsEl = document.getElementById('fps');
        const framesEl = document.getElementById('frames');
        const latencyEl = document.getElementById('latency');
        
        let ws = null;
        let frameCount = 0;
        let fpsCounter = 0;
        let lastFpsTime = performance.now();
        let lastFrameTime = performance.now();
        
        const serverUrl = localStorage.getItem('serverUrl') || 
            `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;
        document.getElementById('serverUrl').value = serverUrl;
        
        function setStatus(status) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }
        
        function connect() {
            if (ws) ws.close();
            
            setStatus('connecting');
            ws = new WebSocket(serverUrl);
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = () => setStatus('connected');
            ws.onclose = () => setStatus('disconnected');
            ws.onerror = () => setStatus('error');
            
            ws.onmessage = async (event) => {
                const now = performance.now();
                const latency = Math.round(now - lastFrameTime);
                lastFrameTime = now;
                latencyEl.textContent = latency + 'ms';
                
                const blob = new Blob([event.data], { type: 'image/png' });
                const img = new Image();
                img.onload = () => {
                    if (canvas.width !== img.width || canvas.height !== img.height) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(img.src);
                    
                    frameCount++;
                    fpsCounter++;
                    framesEl.textContent = frameCount;
                    
                    if (now - lastFpsTime >= 1000) {
                        fpsEl.textContent = fpsCounter;
                        fpsCounter = 0;
                        lastFpsTime = now;
                    }
                };
                img.src = URL.createObjectURL(blob);
                setStatus('streaming');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function saveFrame() {
            const link = document.createElement('a');
            link.download = `remarkable-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.querySelector('.viewer').requestFullscreen();
            }
        }
        
        function showConfig() {
            document.getElementById('configOverlay').classList.remove('hidden');
        }
        
        function closeConfig() {
            document.getElementById('configOverlay').classList.add('hidden');
        }
        
        function saveConfig() {
            const url = document.getElementById('serverUrl').value;
            localStorage.setItem('serverUrl', url);
            closeConfig();
            if (ws) {
                disconnect();
                connect();
            }
        }
        
        // Auto-connect
        connect();
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f') toggleFullscreen();
            if (e.key === 's') saveFrame();
            if (e.key === 'c') connect();
            if (e.key === 'd') disconnect();
        });
    </script>
</body>
</html>
