[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remarkable-sync"
version = "0.1.0"
description = "Bidirectional sync between reMarkable, Obsidian, and Notion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Cole Leavitt" },
]
keywords = ["remarkable", "obsidian", "notion", "sync", "handwriting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]
dependencies = [
    "httpx>=0.27",
    "watchdog>=4",
    "rmscene>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "maturin>=1.5",
]

[project.scripts]
remarkable-sync = "remarkable_sync.cli:main"

[project.urls]
Homepage = "https://github.com/coleleavitt/remarkable-notes-sync"
Documentation = "https://github.com/coleleavitt/remarkable-notes-sync#readme"
Repository = "https://github.com/coleleavitt/remarkable-notes-sync.git"

[tool.hatch.build.targets.wheel]
packages = ["python/remarkable_sync"]
