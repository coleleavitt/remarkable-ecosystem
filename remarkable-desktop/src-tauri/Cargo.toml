[package]
name = "remarkable-desktop"
version = "0.1.0"
description = "reMarkable Desktop Sync Application"
authors = ["cole"]
license = "MIT"
repository = "https://github.com/coleleavitt/remarkable-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for sync
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Hashing for file verification
sha2 = "0.10"
base64 = "0.22"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for document IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# File watching for sync
notify = { version = "7.0", default-features = false, features = ["serde"] }

# Database for sync state
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
thiserror = "2"
dirs = "6"
anyhow = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
